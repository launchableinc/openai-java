plugins {
    id "com.vanniktech.maven.publish" version "0.34.0"
}

allprojects {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublishing {
            // Publish to Maven Central via Central Portal (no authentication required for users!)
            publishToMavenCentral(true)
            signAllPublications()
        }
    }
}
